<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SUNOP - Admin Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin-top: 5px;
            font-size: 18px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>SUNOP</h1>

        <h2>Admin Login</h2>


        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <div class="info">

            <p>Solar Unified Network Operation Platform</p>

            <p>Admin Access</p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
